<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國關論文猜猜看</title>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff6ec; --bg2:#ffe9f0; --card:#ffffff; --ink:#4a3b52; --muted:#9a8aa3; --line:#f1dde6;
    --pink:#ff8fb1; --pink-soft:#ffe3ec; --mint:#7fd8be; --mint-soft:#dcf7ee; --sun:#ffc857; --sun-soft:#fff3d1;
    --lav:#b9a7ff; --lav-soft:#eee9ff; --shadow:0 6px 0 #f3d6e0;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#2a2233; --bg2:#33283d; --card:#3a2f45; --ink:#f6eef9; --muted:#bba9c6; --line:#4d4059;
      --pink-soft:#5a3446; --mint-soft:#284a42; --sun-soft:#54472a; --lav-soft:#3f3860; --shadow:0 6px 0 #241c2c; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:"Huninn","Noto Sans TC",system-ui,sans-serif;line-height:1.65;
    background:radial-gradient(circle at 10% 0%,var(--bg2) 0,transparent 40%),radial-gradient(circle at 100% 30%,var(--lav-soft) 0,transparent 35%),var(--bg);}
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 56px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  h1{font-size:1.45rem;margin:0;letter-spacing:.03em}
  h1 small{display:block;font-size:.75rem;color:var(--muted);letter-spacing:.05em}
  .num{font-family:"Nunito",sans-serif;font-weight:800}
  .bar{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
  .stars{flex:1;display:flex;gap:4px}
  .stars i{flex:1;height:10px;border-radius:99px;background:var(--line);transition:background .3s}
  .stars i.on{background:var(--pink)} .stars i.half{background:var(--sun)} .stars i.cur{background:var(--lav)}
  .score{background:var(--sun-soft);border-radius:99px;padding:2px 12px;font-size:.9rem;white-space:nowrap}
  .card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
  .owlrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}
  .bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 13px;font-size:.92rem}
  .bubble:before{content:"";position:absolute;left:-9px;bottom:12px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
  .owl{width:58px;height:58px;flex:none;transition:transform .3s}
  .owl.happy{animation:hop .6s ease 2} .owl.sad{animation:wob .5s ease 2}
  @keyframes hop{50%{transform:translateY(-10px) rotate(-6deg)}}
  @keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--lav-soft)}
  .chip.y{background:var(--mint-soft)}
  .abstract{font-size:1.02rem;margin:0}
  label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 6px;font-size:.95rem}
  .hintbtn{font:inherit;font-size:.78rem;border:2px dashed var(--pink);background:none;color:var(--pink);border-radius:99px;padding:1px 10px;cursor:pointer;white-space:nowrap}
  .hintbtn:disabled{opacity:.45;cursor:default}
  .clue{font-family:"Nunito",monospace;letter-spacing:.06em;font-size:.85rem;color:var(--muted);margin:-2px 2px 6px;word-break:break-word}
  .in{width:100%;font:inherit;font-size:16px;padding:12px 15px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
  .in:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 4px var(--pink-soft)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn{font:inherit;font-size:1rem;background:var(--pink);color:#fff;border:0;border-radius:16px;padding:11px 22px;cursor:pointer;box-shadow:0 4px 0 #e06d92;transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e06d92}
  .btn.ghost{background:var(--card);color:var(--muted);border:2px solid var(--line);box-shadow:none}
  .btn:disabled{opacity:.5;cursor:default}
  .result{margin-top:16px;display:none;animation:pop .35s ease}
  .result.show{display:block}
  @keyframes pop{from{transform:scale(.95);opacity:0}}
  .verdict{font-size:1.15rem}
  .cmp{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:.88rem}
  .cmp th{text-align:left;vertical-align:top;width:3.2em;color:var(--muted);font-weight:400;padding:7px 0}
  .cmp td{padding:7px 0;border-top:2px dotted var(--line);word-break:break-word}
  .ok{color:#2f9e7a} .half{color:#d99a00} .no{color:var(--pink)}
  .answer{background:var(--mint-soft);border-radius:16px;padding:12px 14px;margin-top:10px}
  .answer .t{font-family:"Nunito","Noto Sans TC",sans-serif;font-weight:800;line-height:1.4}
  .m{font-size:.84rem;color:var(--muted)}
  .center{text-align:center}
  .big{font-family:"Nunito",sans-serif;font-weight:800;font-size:2.6rem;margin:4px 0;color:var(--pink)}
  .review{text-align:left;margin:16px 0 0;padding-left:1.3em;font-size:.84rem}
  .review li{margin-bottom:7px}
  .note{font-size:.75rem;color:var(--muted);margin-top:22px;line-height:1.6}
  .confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:3px;pointer-events:none;animation:fall 1.6s ease-in forwards;z-index:9}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
</style>
</head>

const STOP=new Set("the a an of and in to for on how what is are its after about from with into beyond than why when does do would".split(" "));
const norm=x=>x.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i").replace(/ø/g,"o").replace(/ß/g,"ss").toLowerCase();
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 3;const d=Array.from({length:m+1},(_,r)=>[r]);for(let c=1;c<=n;c++)d[0][c]=c;
  for(let r=1;r<=m;r++)for(let c=1;c<=n;c++)d[r][c]=Math.min(d[r-1][c]+1,d[r][c-1]+1,d[r-1][c-1]+(a[r-1]===b[c-1]?0:1));return d[m][n];}
const close=(w,u)=>w===u||(w.length>=4&&u.length>=4&&(lev(w,u)<=(w.length>=8?2:1)||w.slice(0,5)===u.slice(0,5)));
const words=x=>norm(x).replace(/-/g," ").split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.replace(/s$/,""));
function ratio(g,t){const key=[...new Set(words(t))];return key.length?key.filter(w=>g.some(u=>close(w,u))).length/key.length:0;}
function scoreTitle(guess,t){
  const g=words(guess); if(!g.length) return {pts:0,r:0};
  const main=t.split(":")[0], r=Math.max(ratio(g,t), main!==t?ratio(g,main):0);
  return {pts:r>=.5?2:r>=.25?1:0, r};
}
const surnames=a=>a.split(/,|&/).map(x=>x.trim()).filter(Boolean).map(n=>norm(n.split(/\s+/).pop()).replace(/[^a-z]/g,""));
function scoreAuthor(guess,a){
  const sn=surnames(a), g=norm(guess), compact=g.replace(/[^a-z]/g,""), toks=g.replace(/-/g,"").split(/[^a-z]+/).filter(Boolean);
  const hit=sn.filter(s=>(s.length>=4&&compact.includes(s))||toks.some(u=>close(s,u))).length;
  return {pts:hit>0?2:0, hit, n:sn.length};
}

/* ---------- 提示 ---------- */
const titleClue=t=>t.split(/(\s+)/).map(w=>/\s/.test(w)?w:w.replace(/([A-Za-zÀ-ž])([A-Za-zÀ-ž'’\-]*)/,(m,f,rest)=>f+rest.replace(/[A-Za-zÀ-ž'’]/g,"_"))).join("");
const authorClue=a=>a.split(/(,\s*|\s*&\s*)/).map(p=>/^(,\s*|\s*&\s*)$/.test(p)?p:p.split(/\s+/).map((w,k,arr)=>k===arr.length-1?w[0]+w.slice(1).replace(/[^\-]/g,"_"):w[0]+".").join(" ")).join("");

/* ---------- 狐狸教授 ---------- */
const OWL=$("owlHead").outerHTML.replace('id="owlHead"','id="owl"');
const LINES={start:["這篇我超愛的，你讀過嗎？","慢慢想，不急～","提示：先猜作者通常比較簡單喔！","看到關鍵字就打打看吧！"],
  full:["太厲害了！你是國關活字典 ✨","完全正確！給你一顆星星 ⭐","哇！這篇你一定讀得很熟～"],
  half:["差一點點！已經很棒了～","有抓到重點喔！","很接近了，加油加油！"],
  zero:["沒關係，這篇比較冷門～","下一題一定可以！","記下來，下次就會了 📚"]};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function say(text,mood){ $("say").textContent=text; const o=$("owl"); o.classList.remove("happy","sad"); void o.offsetWidth; if(mood) o.classList.add(mood); }

function drawStars(){
  $("stars").innerHTML=Array.from({length:ROUNDS},(_,k)=>{const l=log[k];return `<i class="${l?(l.tp+l.ap>=4?"on":l.tp+l.ap>0?"half":""):(k===i?"cur":"")}"></i>`}).join("");
  $("score").textContent=score;
}

function start(){ deck=shuffle(DB).slice(0,ROUNDS); i=0; score=0; log=[]; render(); }

function render(){
  const it=deck[i]; hintCost=0; drawStars();
  $("app").innerHTML=`
    <div class="card">
      <div class="owlrow">${OWL}<div class="bubble" id="say"></div></div>
      <div class="chips"><span class="chip">第 <span class="num">${i+1}</span> / ${ROUNDS} 題</span><span class="chip y">📖 ${esc(it.j)} · ${it.y}</span></div>
      <p class="abstract">${esc(it.s)}</p>
    </div>
    <form id="f" autocomplete="off">
      <label>📝 標題是什麼？<button class="hintbtn" type="button" id="hT">首字母提示 −1</button></label>
      <div class="clue" id="cT"></div>
      <input class="in" id="gT" placeholder="打出記得的關鍵字就好，例如 Weaponized…" autocapitalize="off" spellcheck="false">
      <label>👩‍🏫 作者是誰？<button class="hintbtn" type="button" id="hA">姓名提示 −1</button></label>
      <div class="clue" id="cA"></div>
      <input class="in" id="gA" placeholder="猜中任一位的姓氏就得分，例如 Farrell" autocapitalize="off" spellcheck="false">
      <div class="row"><button class="btn" type="submit">送出答案 ✨</button><button class="btn ghost" type="button" id="skip">投降，看答案</button></div>
    </form>
    <div class="result" id="res"></div>`;
  say(pick(LINES.start));
  $("hT").onclick=e=>{hintCost++; e.target.disabled=true; $("cT").textContent=titleClue(it.t); say("給你偷看一下開頭字母～");};
  $("hA").onclick=e=>{hintCost++; e.target.disabled=true; $("cA").textContent=authorClue(it.a); say("名字的第一個字母在這裡喔！");};
  $("f").onsubmit=e=>{e.preventDefault(); finishRound(it,$("gT").value,$("gA").value);};
  $("skip").onclick=()=>finishRound(it,"","");
}

const verdict=p=>p===2?'<b class="ok">✓ 答對了</b>':p===1?'<b class="half">◐ 部分正確</b>':'<b class="no">✗ 沒猜中</b>';

function finishRound(it,gT,gA){
  const T=scoreTitle(gT,it.t), A=scoreAuthor(gA,it.a), raw=T.pts+A.pts;
  const pts=Math.max(0,raw-hintCost);
  score+=pts; log.push({it,tp:T.pts,ap:A.pts,pts});
  document.querySelectorAll("#f input,#f button").forEach(x=>x.disabled=true);
  const mood=raw===4?"full":raw>0?"half":"zero";
  say(pick(LINES[mood]), raw>0?"happy":"sad");
  if(raw===4) confetti();
  drawStars();
  const res=$("res");
  res.innerHTML=`<div class="card">
    <div class="verdict">${raw===4?"🎉 全對！":raw>0?"🌱 有猜到！":"🍂 這題沒猜中"} <span class="num">+${pts}</span> 分</div>
    <table class="cmp">
      <tr><th>標題</th><td>${gT.trim()?esc(gT):'<span class="m">（沒作答）</span>'}<br>${verdict(T.pts)} <span class="m">關鍵字吻合 ${Math.round(T.r*100)}%</span></td></tr>
      <tr><th>作者</th><td>${gA.trim()?esc(gA):'<span class="m">（沒作答）</span>'}<br>${verdict(A.pts)} <span class="m">猜中 ${A.hit}/${A.n} 位</span></td></tr>
    </table>
    <div class="answer"><div class="m">正確答案</div><div class="t">${esc(it.t)}</div><div class="m">${esc(it.a)} · <i>${esc(it.j)}</i>, ${it.y}</div></div>
    <div class="row"><button class="btn" id="next">${i+1<ROUNDS?"下一題 →":"看成績單 🏆"}</button></div></div>`;
  res.classList.add("show");
  $("next").onclick=()=>{i++; i<ROUNDS?render():end(); window.scrollTo({top:0,behavior:"smooth"});};
  res.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function end(){
  log.length===ROUNDS && (i=ROUNDS); drawStars();
  const max=ROUNDS*4, pct=score/max;
  const [title,line]=pct>=.8?["🏅 國關頂刊活字典","教授我都要拜你為師了！"]:pct>=.55?["🎓 優秀研究生","離博士資格考只差一步～"]:pct>=.3?["📚 認真的大學生","再多讀幾篇就會更厲害！"]:["🐣 國關新手村","一起去圖書館吧！"];
  const mk=p=>p===2?"✓":p===1?"◐":"✗";
  $("app").innerHTML=`<div class="card center">
    <div class="owlrow" style="justify-content:center">${OWL}<div class="bubble" id="say"></div></div>
    <div class="m">最終成績</div><div class="big">${score} / ${max}</div><div><b>${title}</b></div>
    <ol class="review">${log.map(l=>`<li>${mk(l.tp)}標題 ${mk(l.ap)}作者 — <i>${esc(l.it.t)}</i>（${esc(l.it.a)}, ${jShort(l.it.j)} ${l.it.y}）</li>`).join("")}</ol>
    <div class="row" style="justify-content:center"><button class="btn" id="again">再玩一輪 🔁</button></div></div>`;
  say(line, pct>=.3?"happy":null);
  if(pct>=.55) confetti();
  $("again").onclick=start;
}

function confetti(){
  const colors=["#ff8fb1","#ffc857","#7fd8be","#b9a7ff"];
  for(let k=0;k<36;k++){const c=document.createElement("div");c.className="confetti";
    c.style.left=Math.random()*100+"vw";c.style.background=colors[k%4];c.style.animationDelay=Math.random()*.4+"s";
    document.body.appendChild(c);setTimeout(()=>c.remove(),2200);}
}

start();
</script>
