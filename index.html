<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國關論文猜猜看</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f2ea; --card:#fffdf8; --ink:#1f2328; --muted:#6b6f76; --line:#e2dccf;
    --accent:#7a2e2e; --accent-soft:#f3e4df; --ok:#2f6b3a; --ok-soft:#e1efe3; --bad:#9a3b2a; --bad-soft:#f6e1dc;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17181a; --card:#212226; --ink:#ece9e3; --muted:#9a9ca1; --line:#34363b;
      --accent:#e0a39a; --accent-soft:#3a2a28; --ok:#8fcf99; --ok-soft:#203126; --bad:#f0a090; --bad-soft:#3a2522; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
  h1{font-family:"Noto Serif TC",serif;font-size:1.35rem;margin:0;letter-spacing:.02em}
  .stat{font-size:.85rem;color:var(--muted);white-space:nowrap}
  .stat b{color:var(--ink);font-size:1rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .label{font-size:.75rem;letter-spacing:.12em;color:var(--accent);font-weight:700;text-transform:uppercase;margin-bottom:6px}
  .abstract{font-family:"Noto Serif TC",serif;font-size:1.02rem;margin:0}
  .hint{margin-top:12px;font-size:.85rem;color:var(--muted)}
  .hint button{font:inherit;background:none;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer}
  .hint .reveal{color:var(--ink)}
  h2{font-size:.95rem;margin:22px 0 8px}
  .opts{display:grid;gap:8px}
  .opt{font:inherit;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;font-size:.92rem;line-height:1.45}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:disabled{cursor:default}
  .opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
  .opt.dim{opacity:.5}
  .result{margin-top:18px;padding:14px;border-radius:12px;background:var(--accent-soft);display:none}
  .result.show{display:block}
  .result .t{font-family:"Noto Serif TC",serif;font-weight:700}
  .result .m{font-size:.85rem;color:var(--muted)}
  .btn{font:inherit;font-weight:700;background:var(--accent);color:var(--card);border:0;border-radius:10px;padding:11px 18px;cursor:pointer;margin-top:14px}
  .center{text-align:center}
  .big{font-family:"Noto Serif TC",serif;font-size:2.4rem;margin:6px 0}
  .review{text-align:left;margin-top:16px;font-size:.85rem}
  .review li{margin-bottom:8px}
  .note{font-size:.75rem;color:var(--muted);margin-top:22px}
  .pts{font-weight:700}
.in{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .in:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}
  .cmp{width:100%;border-collapse:collapse;margin-top:8px;font-size:.88rem}
  .cmp th{text-align:left;vertical-align:top;width:3.5em;color:var(--muted);font-weight:500;padding:6px 0}
  .cmp td{padding:6px 0;border-top:1px solid var(--line)}
  .ok{color:var(--ok);font-weight:700}.half{color:var(--accent);font-weight:700}.no{color:var(--bad);font-weight:700}
  .tag{display:inline-block;font-size:.7rem;padding:0 6px;border-radius:6px;background:var(--card);border:1px solid var(--line);color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>國關論文猜猜看</h1>
    <div class="stat">第 <b id="rnd">1</b>/<span id="tot">10</span> 題 · 分數 <b id="score">0</b></div>
  </header>
  <main id="app"></main>
  <p class="note">題庫：2016–2024 年間發表於國關／安全研究期刊的高引用論文，共 26 篇。2021 年以前的篇目 Google Scholar 引用數普遍逾 200；2022 年後的新作是同期引用最多的一批，但因發表時間較短，未必都已達 200。引用數未經即時查證。摘要為重新改寫的中文概述，非原文摘要。計分：標題（或冒號前的主標題）關鍵字吻合 75% 以上 +2、40% 以上 +1；作者全猜中 +2、猜中部分 +1；拼錯一個字母也算對；看提示 −1。</p>
</div>

<script>

 {t:"The Power of Nations: Measuring What Matters", a:"Michael Beckley", j:"International Security", y:2018,
  s:"GDP 與軍費等常用指標會嚴重誤判國家實力，因為它們只看總量、忽略維持人口與安全所需的成本。作者主張以「淨資源」衡量權力，並據此重新評估歷史上的大國競爭，以及美中之間的真實差距。"},
 {t:"Why Russia Attacked Ukraine: Strategic Culture and Radicalized Narratives", a:"Elias Götz & Jørgen Staun", j:"Contemporary Security Policy", y:2022, recent:true,

 {t:"The Causes and Consequences of the Ukraine War", a:"John J. Mearsheimer", j:"Horizons", y:2022, recent:true,
  s:"這篇由演講改寫的文章挑戰西方主流說法，主張美國把烏克蘭拉進北約、使其成為俄國邊境上的西方堡壘，才是危機的主因；俄國的動機是安全而非擴張。作者並警告戰爭可能長期化，甚至有升級為北約直接參戰或動用核武的風險。"},
 {t:"Imperialism, Supremacy, and the Russian Invasion of Ukraine", a:"Kseniya Oksamytna", j:"Contemporary Security Policy", y:2023, recent:true,

 {t:"Dual Use Deception: How Technology Shapes Cooperation in International Relations", a:"Jane Vaynman & Tristan A. Volpe", j:"International Organization", y:2023, recent:true,

 {t:"Three Worlds: The West, East and South and the Competition to Shape Global Order", a:"G. John Ikenberry", j:"International Affairs", y:2024, recent:true,

 {t:"The Global Governance of Artificial Intelligence: Next Steps for Empirical and Normative Research", a:"Jonas Tallberg, Eva Erman, Markus Furendal, Johannes Geith, Mark Klamberg & Magnus Lundgren", j:"International Studies Review", y:2023, recent:true,
  s:"政治學與國關對 AI 的研究多半聚焦在應用，較少關注正在形成的全球規範架構。作者提出一套研究議程：一方面以實證方法描繪並解釋 AI 如何在全球層次被治理、由誰推動；另一方面以規範理論檢驗這些安排是否符合正義與民主的標準。"}

const ROUNDS = 10;
let deck=[], i=0, score=0, hintUsed=false, picked={t:null,a:null}, log=[];
const $ = id => document.getElementById(id);
const shuffle = a => { a=[...a]; for(let k=a.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]];} return a; };
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function start(){
  deck = shuffle(DB).slice(0, ROUNDS); i=0; score=0; log=[];
  $("tot").textContent = ROUNDS; render();
}

const STOP=new Set("the a an of and in to for on how what is are its after about from with into beyond than why when does do".split(" "));
const norm=x=>x.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i").replace(/ø/g,"o").replace(/ß/g,"ss").toLowerCase();
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 2;const d=Array.from({length:m+1},(_,r)=>[r]);for(let c=1;c<=n;c++)d[0][c]=c;
  for(let r=1;r<=m;r++)for(let c=1;c<=n;c++)d[r][c]=Math.min(d[r-1][c]+1,d[r][c-1]+1,d[r-1][c-1]+(a[r-1]===b[c-1]?0:1));return d[m][n];}
const close=(w,u)=>w===u||(w.length>=5&&u.length>=5&&(lev(w,u)<=1||w.slice(0,6)===u.slice(0,6)));
const words=x=>norm(x).replace(/-/g," ").split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.replace(/s$/,""));

function ratio(guessWords,t){const key=[...new Set(words(t))];return key.filter(w=>guessWords.some(u=>close(w,u))).length/key.length;}
function scoreTitle(guess,t){
  const g=words(guess); if(!g.length) return {pts:0,r:0};
  const main=t.split(":")[0], r=Math.max(ratio(g,t), main!==t?ratio(g,main):0);
  return {pts:r>=.75?2:r>=.4?1:0, r};
}
function surnames(a){return a.split(/,|&/).map(x=>x.trim()).filter(Boolean).map(n=>norm(n.split(/\s+/).pop()).replace(/[^a-z]/g,""));}
function scoreAuthor(guess,a){
  const sn=surnames(a), g=norm(guess), compact=g.replace(/[^a-z]/g,""), toks=g.replace(/-/g,"").split(/[^a-z]+/).filter(Boolean);
  const hit=sn.filter(s=>(s.length>=4&&compact.includes(s))||toks.some(u=>close(s,u))).length;
  return {pts:hit===sn.length?2:hit>0?1:0, hit, n:sn.length};
}

function render(){
  const it = deck[i]; hintUsed=false;
  $("rnd").textContent=i+1; $("score").textContent=score;
  $("app").innerHTML = `
    <div class="card">
      <div class="label">摘要</div>
      <p class="abstract">${esc(it.s)}</p>
      <div class="hint" id="hint"><button id="hintBtn">看提示：期刊與年份（−1）</button></div>
    </div>
    <form id="f" autocomplete="off">
      <h2>標題（英文，主標題對就算全對）</h2>
      <input class="in" id="gT" placeholder="例如：Weaponized Interdependence…" autocapitalize="off" spellcheck="false">
      <h2>作者（姓氏即可，多位作者用逗號分隔）</h2>
      <input class="in" id="gA" placeholder="例如：Farrell, Newman" autocapitalize="off" spellcheck="false">
      <div class="row"><button class="btn" type="submit">送出</button><button class="btn ghost" type="button" id="skip">放棄，看答案</button></div>
    </form>
    <div class="result" id="res"></div>`;
  $("hintBtn").onclick = () => { hintUsed=true; $("hint").innerHTML = `<span class="reveal">${esc(it.j)}，${it.y}</span>`; };
  $("f").onsubmit = e => { e.preventDefault(); finishRound(it, $("gT").value, $("gA").value); };
  $("skip").onclick = () => finishRound(it, "", "");
  $("gT").focus({preventScroll:true});
}

const verdict=p=>p===2?'<span class="ok">✓ 正確</span>':p===1?'<span class="half">◐ 部分正確</span>':'<span class="no">✗</span>';

function finishRound(it, gT, gA){
  const T=scoreTitle(gT,it.t), A=scoreAuthor(gA,it.a);
  let pts = T.pts + A.pts - (hintUsed?1:0);
  score += pts; $("score").textContent=score;
  log.push({it, tp:T.pts, ap:A.pts, pts});
  document.querySelectorAll("#f input, #f button").forEach(x=>x.disabled=true);
  const msg = T.pts+A.pts===4 ? "全對！" : T.pts+A.pts>0 ? "有猜到一些" : "這題沒猜中";
  const res = $("res");
  res.innerHTML = `<div><b>${msg}</b> <span class="pts">${pts>=0?"+":""}${pts} 分</span></div>
    <table class="cmp">
      <tr><th>標題</th><td>${gT.trim()?esc(gT):'<span class="m">（未作答）</span>'}<br>${verdict(T.pts)} <span class="m">關鍵字吻合 ${Math.round(T.r*100)}%</span></td></tr>
      <tr><th>作者</th><td>${gA.trim()?esc(gA):'<span class="m">（未作答）</span>'}<br>${verdict(A.pts)} <span class="m">猜中 ${A.hit}/${A.n} 位</span></td></tr>
    </table>
    <div class="label" style="margin-top:12px">正確答案</div>
    <div class="t">${esc(it.t)}</div>
    <div class="m">${esc(it.a)} · <i>${esc(it.j)}</i>, ${it.y}${it.recent?' · <span class="tag">2022 後新作</span>':''}</div>
    <button class="btn" id="next">${i+1<ROUNDS?"下一題":"看結果"}</button>`;
  res.classList.add("show");
  $("next").onclick = () => { i++; i<ROUNDS ? render() : end(); window.scrollTo({top:0,behavior:"smooth"}); };
  $("next").focus({preventScroll:true});
  res.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function end(){
  const max = ROUNDS*4, pct = score/max;
  const title = pct>=.85?"國關期刊活字典":pct>=.6?"資深研究生":pct>=.35?"文獻回顧進行中":"該去圖書館了";
  const mk=p=>p===2?"✓":p===1?"◐":"✗";
  $("app").innerHTML = `<div class="card center">
    <div class="label">最終成績</div>
    <div class="big">${score} / ${max}</div>
    <div><b>${title}</b></div>
    <ol class="review">${log.map(l=>`<li>${mk(l.tp)}標題 ${mk(l.ap)}作者 — <i>${esc(l.it.t)}</i>（${esc(l.it.a)}）</li>`).join("")}</ol>
    <button class="btn" id="again">再玩一輪</button></div>`;
  $("again").onclick = start;
}

start();
</script>
</body>
</html>
